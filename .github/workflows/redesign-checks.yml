name: Website checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci-unused.db
      AUTH_SECRET: isolated-ci-fixture-not-for-production
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install lxml==6.0.2
      - run: npm test
      - run: npm run lint
      - run: npm run test:redesign
      - name: Create an isolated empty build database
        run: python scripts/create-build-fixture.py >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm run validate:redesign
      - run: npm run validate:content
