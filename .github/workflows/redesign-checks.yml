name: Website checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: file:./ci-unused.db
      AUTH_SECRET: isolated-ci-fixture-not-for-production
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Require a clean production dependency audit
        run: npm run audit:production
      - name: Record the full development dependency audit
        id: full-audit
        continue-on-error: true
        run: npm audit --json > dependency-audit.json
      - name: Save the full audit report, including unresolved toolchain findings
        if: always() && steps.full-audit.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: dependency-audit.json
          retention-days: 14
      - run: python -m pip install lxml==6.0.2
      - run: npm test
      - run: npm run lint
      - run: npm run test:redesign
      - run: npm run test:pages
      - name: Create an isolated empty build database
        run: python scripts/create-build-fixture.py >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm run validate:redesign
      - run: npm run validate:content
